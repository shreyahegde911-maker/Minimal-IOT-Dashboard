services:
  # TimescaleDB Time-Series Storage (Member 3)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: miniot-timescaledb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=miniot
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miniot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API & WebSocket Stream (Member 2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: miniot-backend
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=miniot
      - API_TOKEN=${API_TOKEN}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Multi-Sensor Telemetry Simulator (Member 3)
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: miniot-simulator
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_INGEST_URL=http://backend:3000/api/telemetry
      - SIMULATION_INTERVAL_SEC=3
      - API_TOKEN=${API_TOKEN}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://backend:3000/api/health\", timeout=2)'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Analytics, Anomaly Engine & Alert Worker (Member 4)
  analytics-alerting:
    build:
      context: .
      dockerfile: analytics_alerting/Dockerfile
    container_name: miniot-analytics
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:3000
      - Z_SCORE_THRESHOLD=3.0
      - ROLLING_WINDOW_SIZE=60
      - TEMP_HIGH_THRESHOLD=35.0
      - ALERT_COOLDOWN_SECONDS=60
    restart: always
    healthcheck:
      test: ["CMD", "python", "-m", "analytics_alerting.src.health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  default:
    name: miniot-network

volumes:
  timescale_data:
