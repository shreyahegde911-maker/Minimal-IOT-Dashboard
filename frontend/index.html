<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minimal IoT Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>Minimal IoT Dashboard</h1>
            <p>Temperature & Humidity Monitoring</p>
        </div>

        <div id="connection-status" class="status disconnected">
            ● Disconnected
        </div>
    </header>


    <main class="dashboard-container">

        <!-- Device Status -->
        <section class="device-section">

            <h2>Device Status</h2>

            <div id="device-cards" class="device-cards">
                <!-- Device cards will be created dynamically -->
            </div>

                </section>

        <!-- Per-Device Statistics -->
        <section class="statistics-section">
            <h2>Per-Device Statistics</h2>

            <div id="device-statistics" class="device-statistics">
                <!-- Statistics cards will be created dynamically -->
            </div>
        </section>

        <!-- Live Charts -->
        <section class="charts-section">

            <h2>Live Telemetry</h2>

            <div class="chart-card">
                <h3>Temperature</h3>
                <canvas id="temperature-chart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Humidity</h3>
                <canvas id="humidity-chart"></canvas>
            </div>

        </section>


        <!-- Historical Logs -->
        <section class="history-section">

            <h2>Historical Logs</h2>
            
            <div class="date-filter">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date">

                <label for="end-date">End Date:</label>
                <input type="date" id="end-date">

                <button id="apply-date-filter">Apply Filter</button>
                <button id="clear-date-filter">Clear Filter</button>
            </div>

            <p id="filter-message" role="status"></p>


            <div class="export-buttons">
                <button id="export-csv">Export CSV</button>
                <button id="export-json">Export JSON</button>
            </div>

            <div class="table-controls">
                <span id="log-count-info">Showing latest 6 logs</span>
                <div class="table-actions">
                    <label for="log-limit-select">Show:</label>
                    <select id="log-limit-select">
                        <option value="6" selected>6 logs</option>
                        <option value="12">12 logs</option>
                        <option value="25">25 logs</option>
                        <option value="50">50 logs</option>
                        <option value="all">All logs</option>
                    </select>
                    <button id="toggle-expand-logs">Expand All</button>
                </div>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Device</th>
                            <th>Temperature</th>
                            <th>Humidity</th>
                        </tr>
                    </thead>

                    <tbody id="telemetry-table-body">
                        <!-- Telemetry rows will be added here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Socket.IO Client -->
<script src="/socket.io/socket.io.js"></script>
<script>
    if (typeof io === "undefined") {
        document.write('<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"><\/script>');
    }
</script>

<!-- Our Dashboard JavaScript -->
<script src="app.js"></script>

</body>
</html>
